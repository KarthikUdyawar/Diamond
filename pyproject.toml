[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diamond"
version = "1.0.0"
description = "Diamond price prediction — ML pipeline, FastAPI, Streamlit, MLflow"
requires-python = "==3.11.*"
dependencies = [
    # Core ML
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "catboost==1.2.5",
    "scikit-learn==1.4.2",
    "optuna==3.6.1",
    "mlflow==2.13.0",
    "shap==0.45.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pandera==0.19.3",
    "joblib==1.4.2",
    "pyarrow==15.0.2",
    # API
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.7.1",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    # Dashboard
    "streamlit==1.35.0",
    "plotly==5.22.0",
    # Database
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    # Kaggle
    "kaggle==1.6.14",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    # Linting & formatting (must match .pre-commit-config.yaml rev: v0.15.4)
    "ruff==0.15.4",
    # Type checking (must match .pre-commit-config.yaml rev: v1.19.1)
    "mypy==1.19.1",
    # Security scanning
    "bandit==1.9.4",
    # Pre-commit framework
    "pre-commit==3.7.1",
    # Type stubs
    "pandas-stubs==2.2.2.240603",
    "types-requests==2.32.0.20240602",
    "pydantic-settings==2.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "ui"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "N806"]

# ---------------------------------------------------------------------------
# bandit  (skips: B101=assert used in tests, B113=subprocess timeout)
# ---------------------------------------------------------------------------
[tool.bandit]
skips = ["B101", "B113"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["api/tests", "src/tests"]
addopts = "-v --cov=api --cov=src --cov-report=term-missing"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
omit = ["*/tests/*", "*/conftest.py"]
