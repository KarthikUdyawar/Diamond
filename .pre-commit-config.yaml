repos:
  # Very fast basic checks first
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-ast
      - id: debug-statements
        language_version: python3
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=develop
          - --pattern=release/.*

  # ────────────────────────────────────────────────
  # YAML & Markdown formatting
  # ────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        name: MarkdownLint (lint + fix)
        files: \.md$
        args: [--fix, --config=.markdownlint.yaml]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  # ────────────────────────────────────────────────
  # Python formatting & import sorting & autofixes
  # ────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        name: Ruff (lint + autofix)
        exclude: ^notebooks/
        args: [--fix, --exit-non-zero-on-fix, --verbose]

      - id: ruff-format
        name: Ruff (format)
        exclude: ^notebooks/
        args: [--verbose]

  # ────────────────────────────────────────────────
  # Security & secret scanning
  # ────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [--format=screen, --quiet, -s=B101, B113]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ────────────────────────────────────────────────
  # Type checking (runs last – slowest)
  # ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: \.pyi?$
        exclude: ^tests/
        args:
          [
            --strict,
            --ignore-missing-imports,
            --explicit-package-bases,
            --disable-error-code=untyped-decorator,
          ]
        additional_dependencies:
          - fastapi
          - sqlalchemy[mypy]
          - pydantic[mypy]
          - pydantic-settings
          - pandas-stubs
          - types-requests
          - numpy
