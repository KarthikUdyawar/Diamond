name: diamond

networks:
  diamond-net:
    driver: bridge

volumes:
  postgres-data:
  mlflow-artifacts:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — MLflow backend store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: diamond-postgres
    restart: unless-stopped
    networks:
      - diamond-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MLflow — experiment tracking + model registry
  # Startup order: postgres (healthy) → mlflow
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: diamond-mlflow
    restart: unless-stopped
    networks:
      - diamond-net
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      bash -c "pip install psycopg2-binary --quiet &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API — FastAPI prediction + explain endpoints
  # Startup order: mlflow (healthy) → api
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: diamond-api
    restart: on-failure
    networks:
      - diamond-net
    volumes:
      - mlflow-artifacts:/mlflow/artifacts:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # UI — Streamlit dashboard
  # Startup order: api → ui
  # ---------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: diamond-ui
    restart: on-failure
    networks:
      - diamond-net
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
